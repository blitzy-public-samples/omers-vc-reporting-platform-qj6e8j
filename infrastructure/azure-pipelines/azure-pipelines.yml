# Azure Pipelines configuration for OMERS Ventures Backend Platform
# This file defines the CI/CD pipeline for building, testing, and deploying the backend services.

# Trigger the pipeline on pushes to the main branch
trigger:
  - main

# Use the latest Ubuntu agent pool
pool:
  vmImage: 'ubuntu-latest'

# Define variables for reuse across stages
variables:
  - group: 'backend-secrets' # Link to variable group in Azure DevOps
  - name: dockerRegistryServiceConnection
    value: 'your-acr-service-connection'
  - name: containerRegistry
    value: 'your-acr-name.azurecr.io'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

# Define the stages of the pipeline
stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build and push Docker images
    steps:
    - task: Docker@2
      displayName: Build and push API image
      inputs:
        command: buildAndPush
        repository: $(containerRegistry)/backend-api
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

    # Build and push other service images as needed
    # Example for Authentication Service:
    - task: Docker@2
      displayName: Build and push Authentication Service image
      inputs:
        command: buildAndPush
        repository: $(containerRegistry)/auth-service
        dockerfile: $(Build.SourcesDirectory)/src/backend/authentication_service/Dockerfile
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Test
  displayName: Test stage
  jobs:
  - job: UnitTests
    displayName: Run unit tests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        addToPath: true
    - script: |
        pip install -r requirements.txt
        pip install pytest
        pytest tests/unit
      displayName: 'Run unit tests'
      workingDirectory: $(Build.SourcesDirectory)/src/backend

  - job: IntegrationTests
    displayName: Run integration tests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        addToPath: true
    - script: |
        pip install -r requirements.txt
        pip install pytest
        pytest tests/integration
      displayName: 'Run integration tests'
      workingDirectory: $(Build.SourcesDirectory)/src/backend

- stage: SecurityScan
  displayName: Dependency vulnerability scan
  # Gate ordering: Build -> Test -> SecurityScan; Deploy requires all three (CWE-1104).
  dependsOn: Test
  jobs:
  # The backend services deploy on two distinct runtimes, so each group is
  # audited on the runtime it actually ships on: authentication_service,
  # reporting_financials_service, and reporting_metrics_service on Python 3.10;
  # api_gateway and metrics_input_service on Python 3.9. The data_transformation
  # function app is audited separately on Python 3.11 (see FunctionDependencyScan).
  # Auditing each group on its real runtime lets the gate enforce every fix that
  # is installable there and prevents masking a fixable advisory behind an
  # inaccurate runtime claim. Full rationale: security decision log.
  - job: Python310BackendDependencyScan
    displayName: Scan Python 3.10 backend dependencies with pip-audit
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'
        addToPath: true
    - script: |
        set -u
        python -m pip install --upgrade pip
        # Pin pip-audit for reproducible, deterministic scans (CWE-1104).
        pip install pip-audit==2.9.0

        # These services deploy on Python 3.10, so the patched requests
        # (>= 2.33.0), python-dotenv (1.2.2), urllib3 (>= 2.7.0), and click
        # (>= 8.2.0) are installable here and are therefore enforced (not ignored).
        # Each manifest is audited on its own because the services pin mutually
        # incompatible versions; per-manifest invocation resolves and audits each
        # service's transitive dependency tree.
        MANIFESTS="\
          src/backend/authentication_service/requirements.txt \
          src/backend/reporting_financials_service/requirements.txt \
          src/backend/reporting_metrics_service/requirements.txt"

        # The only suppressed advisories are those whose fix would breach the
        # Pydantic v1 envelope (FastAPI < 0.126 holds starlette below 0.51) or are
        # AAP-deferred. Any NEW or non-listed advisory fails the gate. Full
        # rationale: security decision log.
        IGNORES=""
        # AAP-deferred dev/test toolchain advisories:
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-1845"   # pytest: three-major-version jump deferred (AAP 0.6.4)
        IGNORES="$IGNORES --ignore-vuln PYSEC-2022-14"     # loguru: Windows-only advisory (informational)
        # Fix requires FastAPI >= 0.126 which drops Pydantic v1 (transitive starlette via fastapi 0.125.0):
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-161"    # starlette
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-248"    # starlette
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-249"    # starlette
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-2280"   # starlette
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-2281"   # starlette

        status=0
        for manifest in $MANIFESTS; do
          echo "==================================================================="
          echo "Auditing $manifest (Python 3.10)"
          echo "==================================================================="
          if ! pip-audit -r "$manifest" $IGNORES --progress-spinner off; then
            echo "##vso[task.logissue type=error]pip-audit found unignored vulnerabilities in $manifest"
            status=1
          fi
        done

        if [ "$status" -ne 0 ]; then
          echo "Python 3.10 backend dependency scan FAILED - unignored advisories present (see above)."
          exit 1
        fi
        echo "Python 3.10 backend dependency scan complete: no unignored advisories in the audited manifests."
      displayName: 'Run pip-audit on the Python 3.10 backend manifests'
      workingDirectory: $(Build.SourcesDirectory)

  - job: Python39BackendDependencyScan
    displayName: Scan Python 3.9 backend dependencies with pip-audit
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        addToPath: true
    - script: |
        set -u
        python -m pip install --upgrade pip
        # Pin pip-audit for reproducible, deterministic scans (CWE-1104).
        pip install pip-audit==2.9.0

        # These services deploy on Python 3.9. Each manifest now pins its deployed
        # FastAPI/uvicorn web stack, so the audit resolves and audits the full
        # transitive tree (starlette included). Per-manifest invocation is used
        # because the services pin mutually incompatible versions.
        MANIFESTS="\
          src/backend/api_gateway/requirements.txt \
          src/backend/metrics_input_service/requirements.txt"

        # The only suppressed advisories are those whose fix is not installable on
        # Python 3.9 (click >= 8.2.0 and python-dotenv 1.2.2 both need py >= 3.10),
        # would breach the Pydantic v1 envelope (FastAPI < 0.126 holds starlette
        # below 0.51), or are AAP-deferred. Any NEW or non-listed advisory fails the
        # gate. Full rationale: security decision log.
        IGNORES=""
        # AAP-deferred dev/test toolchain advisory:
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-1845"   # pytest: fix 9.0.3 requires Python >= 3.10 (also AAP-deferred)
        # Fix requires Python >= 3.10 (this group's runtime is 3.9):
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-2132"   # click (transitive via uvicorn): fix >= 8.2.0 needs py >= 3.10
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-2270"   # python-dotenv: fix 1.2.2 needs py >= 3.10 (Python 3.10 services pin the patched 1.2.2)
        # Fix requires FastAPI >= 0.126 which drops Pydantic v1 (transitive starlette via fastapi 0.125.0):
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-161"    # starlette
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-248"    # starlette
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-249"    # starlette
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-2280"   # starlette
        IGNORES="$IGNORES --ignore-vuln PYSEC-2026-2281"   # starlette

        status=0
        for manifest in $MANIFESTS; do
          echo "==================================================================="
          echo "Auditing $manifest (Python 3.9)"
          echo "==================================================================="
          if ! pip-audit -r "$manifest" $IGNORES --progress-spinner off; then
            echo "##vso[task.logissue type=error]pip-audit found unignored vulnerabilities in $manifest"
            status=1
          fi
        done

        if [ "$status" -ne 0 ]; then
          echo "Python 3.9 backend dependency scan FAILED - unignored advisories present (see above)."
          exit 1
        fi
        echo "Python 3.9 backend dependency scan complete: no unignored advisories in the audited manifests."
      displayName: 'Run pip-audit on the Python 3.9 backend manifests'
      workingDirectory: $(Build.SourcesDirectory)

  - job: FunctionDependencyScan
    displayName: Scan Python 3.11 data_transformation dependencies with pip-audit
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
        addToPath: true
    - script: |
        set -u
        python -m pip install --upgrade pip
        # Pin pip-audit for reproducible, deterministic scans (CWE-1104).
        pip install pip-audit==2.9.0

        # This manifest's patched requests/urllib3 require Python >= 3.10, so the
        # audit runs on Python 3.11 to confirm they resolve cleanly. No requests/
        # urllib3 ignores apply here, so the gate enforces those fixes for this
        # manifest. NOTE: the function app's deploy runtime in
        # infrastructure/terraform/main.tf is currently PYTHON|3.9; aligning it to
        # >= 3.10 so these patched pins install at deploy time is a documented
        # deployment follow-up (see SECURITY.md / the security decision log).
        if ! pip-audit -r src/functions/data_transformation/requirements.txt --progress-spinner off; then
          echo "##vso[task.logissue type=error]pip-audit found vulnerabilities in src/functions/data_transformation/requirements.txt"
          echo "Function dependency vulnerability scan FAILED - advisories present (see above)."
          exit 1
        fi
        echo "Function dependency vulnerability scan PASSED for data_transformation."
      displayName: 'Run pip-audit on the Python 3.11 data_transformation manifest'
      workingDirectory: $(Build.SourcesDirectory)

- stage: Deploy
  displayName: Deploy stage
  # Deploy is gated on every upstream success: Build, Test, and SecurityScan must
  # all pass before any deployment runs (prevents unbuilt/untested code reaching prod).
  dependsOn:
    - Build
    - Test
    - SecurityScan
  jobs:
  - deployment: Deploy
    displayName: Deploy to AKS
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            displayName: 'Deploy to AKS'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              namespace: 'default'
              manifests: |
                $(Pipeline.Workspace)/k8s/deployment.yml
                $(Pipeline.Workspace)/k8s/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/backend-api:$(tag)

# Post-deployment tasks
- stage: PostDeploy
  displayName: Post-deployment tasks
  jobs:
  - job: Monitoring
    displayName: Set up monitoring
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'your-azure-subscription'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Set up Azure Monitor alerts
          az monitor alert create \
            --name "High CPU Usage" \
            --resource-group "your-resource-group" \
            --scopes "/subscriptions/your-subscription-id/resourceGroups/your-resource-group/providers/Microsoft.ContainerService/managedClusters/your-aks-cluster" \
            --condition "avg Percentage CPU > 80" \
            --description "Alert when CPU usage is high" \
            --evaluation-frequency 5m \
            --window-size 5m

  - job: Backup
    displayName: Trigger database backup
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'your-azure-subscription'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Trigger a backup of the PostgreSQL database
          az postgres server backup create \
            --resource-group "your-resource-group" \
            --server-name "your-postgres-server" \
            --backup-name "post-deploy-backup-$(Build.BuildId)"

# Define the order of stage execution
- stage: Cleanup
  displayName: Cleanup
  jobs:
  - job: CleanupResources
    displayName: Cleanup temporary resources
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'your-azure-subscription'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Clean up any temporary resources created during the pipeline
          # This could include removing old container images, temporary storage, etc.
          az acr repository delete \
            --name "your-acr-name" \
            --repository "backend-api" \
            --tag "$(tag)" \
            --yes

# Notifications
- stage: Notify
  displayName: Send notifications
  jobs:
  - job: SendNotifications
    displayName: Send deployment notifications
    steps:
    - task: SendTeamsMessage@0
      inputs:
        message: 'Backend platform deployment completed successfully. Build ID: $(Build.BuildId)'
        teamUri: '$(TeamsWebhookUrl)'

# Note: This pipeline assumes the existence of Kubernetes deployment files,
# Azure resource groups, and other infrastructure components.
# Ensure all necessary Azure resources and configurations are in place before running this pipeline.
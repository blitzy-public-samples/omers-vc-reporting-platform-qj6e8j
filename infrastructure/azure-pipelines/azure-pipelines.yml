# Azure Pipelines configuration for OMERS Ventures Backend Platform
# This file defines the CI/CD pipeline for building, testing, and deploying the backend services.

# Trigger the pipeline on pushes to the main branch
trigger:
  - main

# Use the latest Ubuntu agent pool
pool:
  vmImage: 'ubuntu-latest'

# Define variables for reuse across stages
variables:
  - group: 'backend-secrets' # Link to variable group in Azure DevOps
  - name: dockerRegistryServiceConnection
    value: 'your-acr-service-connection'
  - name: containerRegistry
    value: 'your-acr-name.azurecr.io'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

# Define the stages of the pipeline
stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build and push Docker images
    steps:
    - task: Docker@2
      displayName: Build and push API image
      inputs:
        command: buildAndPush
        repository: $(containerRegistry)/backend-api
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

    # Build and push other service images as needed
    # Example for Authentication Service:
    - task: Docker@2
      displayName: Build and push Authentication Service image
      inputs:
        command: buildAndPush
        repository: $(containerRegistry)/auth-service
        dockerfile: $(Build.SourcesDirectory)/src/backend/authentication_service/Dockerfile
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Test
  displayName: Test stage
  jobs:
  - job: UnitTests
    displayName: Run unit tests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        addToPath: true
    - script: |
        pip install -r requirements.txt
        pip install pytest
        pytest tests/unit
      displayName: 'Run unit tests'
      workingDirectory: $(Build.SourcesDirectory)/src/backend

  - job: IntegrationTests
    displayName: Run integration tests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        addToPath: true
    - script: |
        pip install -r requirements.txt
        pip install pytest
        pytest tests/integration
      displayName: 'Run integration tests'
      workingDirectory: $(Build.SourcesDirectory)/src/backend

- stage: SecurityScan
  displayName: Dependency vulnerability scan
  jobs:
  - job: DependencyScan
    displayName: Scan Python dependencies with pip-audit
    steps:
    # Python >=3.10 is required to resolve the platform's patched dependency pins. Each manifest is
    # audited INDEPENDENTLY: pytest is pinned 6.2.4 in most services and 6.2.5 in the authentication
    # service, so a single combined resolution cannot satisfy both. The scanner is pinned for
    # reproducibility.
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'
        addToPath: true
    - script: |
        python -m pip install --upgrade pip
        pip install pip-audit==2.10.1
        status=0
        for manifest in \
          src/backend/api_gateway/requirements.txt \
          src/backend/authentication_service/requirements.txt \
          src/backend/metrics_input_service/requirements.txt \
          src/backend/reporting_financials_service/requirements.txt \
          src/backend/reporting_metrics_service/requirements.txt \
          src/functions/data_transformation/requirements.txt; do
          echo "Auditing $manifest"
          # Governed advisories (rationale in docs/security/decision-log.md): starlette 0.50.0 is the
          # least-vulnerable release compatible with the frozen Pydantic v1 constraint, and the
          # pytest/loguru upgrades are explicitly deferred. Any other finding fails the gate.
          pip-audit -r "$manifest" \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2022-14 \
            || status=1
        done
        exit $status
      displayName: 'Run pip-audit dependency vulnerability scan'
      workingDirectory: $(Build.SourcesDirectory)

- stage: Deploy
  displayName: Deploy stage
  jobs:
  - deployment: Deploy
    displayName: Deploy to AKS
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: Kubernetes@1
            displayName: 'Deploy to AKS'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              namespace: 'default'
              manifests: |
                $(Pipeline.Workspace)/k8s/deployment.yml
                $(Pipeline.Workspace)/k8s/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/backend-api:$(tag)

# Post-deployment tasks
- stage: PostDeploy
  displayName: Post-deployment tasks
  jobs:
  - job: Monitoring
    displayName: Set up monitoring
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'your-azure-subscription'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Set up Azure Monitor alerts
          az monitor alert create \
            --name "High CPU Usage" \
            --resource-group "your-resource-group" \
            --scopes "/subscriptions/your-subscription-id/resourceGroups/your-resource-group/providers/Microsoft.ContainerService/managedClusters/your-aks-cluster" \
            --condition "avg Percentage CPU > 80" \
            --description "Alert when CPU usage is high" \
            --evaluation-frequency 5m \
            --window-size 5m

  - job: Backup
    displayName: Trigger database backup
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'your-azure-subscription'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Trigger a backup of the PostgreSQL database
          az postgres server backup create \
            --resource-group "your-resource-group" \
            --server-name "your-postgres-server" \
            --backup-name "post-deploy-backup-$(Build.BuildId)"

# Define the order of stage execution
- stage: Cleanup
  displayName: Cleanup
  jobs:
  - job: CleanupResources
    displayName: Cleanup temporary resources
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'your-azure-subscription'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Clean up any temporary resources created during the pipeline
          # This could include removing old container images, temporary storage, etc.
          az acr repository delete \
            --name "your-acr-name" \
            --repository "backend-api" \
            --tag "$(tag)" \
            --yes

# Notifications
- stage: Notify
  displayName: Send notifications
  jobs:
  - job: SendNotifications
    displayName: Send deployment notifications
    steps:
    - task: SendTeamsMessage@0
      inputs:
        message: 'Backend platform deployment completed successfully. Build ID: $(Build.BuildId)'
        teamUri: '$(TeamsWebhookUrl)'

# Note: This pipeline assumes the existence of Kubernetes deployment files,
# Azure resource groups, and other infrastructure components.
# Ensure all necessary Azure resources and configurations are in place before running this pipeline.